name: Build and Release LaTeX PDF

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile LaTeX Document
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex"
          glob_root_file: true
          compiler: pdflatex
          args: -interaction=nonstopmode -file-line-error
          work_in_root_file_dir: true

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GK5033-PDF-Report
          path: "*.pdf"

      - name: Create or Update Release with PDF
        uses: ncipollo/release-action@v1
        if: github.event_name != 'pull_request'
        with:
          artifacts: "*.pdf"
          tag: "latest"
          name: "Báo cáo PDF GK5033 mới nhất"
          body: "Báo cáo Bài tập cá nhân học phần Phương pháp nghiên cứu khoa học (GK5033) được biên dịch tự động từ mã nguồn LaTeX mới nhất."
          allowUpdates: true
          replacesArtifacts: true
